services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: laravel_app
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - .:/var/www
        # Start a simple PHP built-in server so the container responds on the mapped port automatically.
        # This is fine for development. For production, use nginx or another proper webserver.
        command: php -S 0.0.0.0:8000 -t public
        env_file:
            - .env.docker
        environment:
            # Ensure the app container connects to the DB service by name
            DB_HOST: db
            TZ: Asia/Manila
        ports:
            - 8000:8000
        depends_on:
            - db

    db:
        image: mysql:8.0
        container_name: mysql_db
        restart: unless-stopped
        env_file:
            - .env.docker
        environment:
            TZ: Asia/Manila
            MYSQL_INITDB_SKIP_TZINFO: 1
            MYSQL_ROOT_HOST: "%"
        ports:
            - "3306:3306"
        volumes:
            - db_data:/var/lib/mysql
        command: ["--default-time-zone=+08:00"]

    phpmyadmin:
        image: phpmyadmin:latest
        container_name: phpmyadmin
        restart: unless-stopped
        environment:
            PMA_HOST: db
            PMA_PORT: 3306
            PMA_AUTH_TYPE: cookie
            PMA_ARBITRARY: 1
            TZ: Asia/Manila
        ports:
            - 8080:80
        depends_on:
            - db

    mailhog:
        image: ghcr.io/axllent/mailpit:latest
        container_name: mailhog
        restart: unless-stopped
        environment:
            TZ: Asia/Manila
        ports:
            - "1025:1025" # SMTP
            - "8025:8025" # Web UI

volumes:
    db_data:

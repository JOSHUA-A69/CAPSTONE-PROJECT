services:
  - type: web
    name: eReligiousServices
    env: docker
    dockerfilePath: docker/prod/Dockerfile
    dockerContext: .
    envVars:
      - key: APP_NAME
        value: eReligiousServices
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        sync: false
      - key: APP_KEY
        sync: false
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        value: mysql
      - key: DB_PORT
        value: 3306
      - key: DB_DATABASE
        value: ers_db
      - key: DB_USERNAME
        value: ers_user
      - key: DB_PASSWORD
        value: change_this_password_in_dashboard

  - type: pserv
    name: mysql
    env: image
    image: mysql:8.0
    disk:
      name: mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 10
    envVars:
      - key: MYSQL_DATABASE
        value: ers_db
      - key: MYSQL_USER
        value: ers_user
      - key: MYSQL_PASSWORD
        value: change_this_password_in_dashboard
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true

# databases: (Removed - using self-hosted MySQL above)
